- name: Установка Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Настроить Nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Restart Nginx

- name: Запуск Nginx
  service:
    name: nginx
    state: started
    enabled: yes
