version: "3.9"

services:
  web:
    image: maftuna09/myflaskapp:latest
    container_name: flask_app
    environment:
      - APP_DATABASE_URI=postgresql://postgres:password@db:5432/mydatabase
    ports:
      - "5000:5000"
    depends_on:
      - db
  
  db:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
    driver: local
